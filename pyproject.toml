[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-middleware-observability"
version = "0.1.0"
description = "LangGraph agent prototype instrumented with NeMo Relay node middleware."
requires-python = ">=3.11"
dependencies = [
  "nemo-relay[langgraph,langchain-nvidia]==0.9.0",
  "nemo-relay-cli-bin==0.9.0",
  "python-dotenv==1.2.3",
  "rich==15.0.0",
]

[project.scripts]
agent-observability-demo = "agent_middleware_observability.run_demo:main"

[tool.setuptools.packages.find]
where = ["src"]
